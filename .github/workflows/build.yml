name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg zip
      - run: npm test

  # The full Windows build only runs for version tags (and manual runs): pushes to main just run the tests.
  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -q zip
      - name: Download bundled runtimes (ffmpeg, whisper.cpp, models)
        run: bash scripts/fetch-vendor.sh
      - run: bash scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PodDirector-Windows
          path: dist/*.zip
          retention-days: 14

  # Install the packaged build on real Windows and run the bundled tools end to end.
  windows-smoke-test:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: PodDirector-Windows, path: dist }
      - name: Install with the user-facing installer
        shell: pwsh
        run: |
          Expand-Archive dist/*.zip -DestinationPath build
          $setup = Get-ChildItem build -Directory | Select-Object -First 1
          & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $setup.FullName "install.ps1")
          $ext = Join-Path $env:APPDATA "Adobe\CEP\extensions\PodDirector"
          if (-not (Test-Path "$ext\CSXS\manifest.xml")) { throw "extension not installed" }
          if ((Get-ItemProperty "HKCU:\Software\Adobe\CSXS.11").PlayerDebugMode -ne "1") { throw "PlayerDebugMode not set" }
      - name: Waveform analysis + offline transcription with the bundled Windows binaries
        shell: pwsh
        run: |
          Invoke-WebRequest https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.9.1/samples/jfk.wav -OutFile jfk.wav
          $env:PD_EXT = Join-Path $env:APPDATA "Adobe\CEP\extensions\PodDirector"
          node scripts/smoke-test.js jfk.wav
      - name: In-panel updater installs a package from an update folder
        shell: pwsh
        timeout-minutes: 8
        run: node scripts/update-test.js dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: PodDirector-Windows, path: dist }
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "PodDirector $GITHUB_REF_NAME" \
            --notes "Windows installer: download the zip, unzip, double-click **Install PodDirector.bat**, then open Window > Extensions > PodDirector in Premiere Pro. See docs/USER_GUIDE.md."
